services:
  - type: web
    name: po-automation-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: po-automation-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_HOURS
        value: "8"
      - key: ALLOWED_ORIGINS
        sync: false   # Set to your Vercel URL after frontend is deployed

databases:
  - name: po-automation-db
    plan: free
    databaseName: po_db
    user: po_user
